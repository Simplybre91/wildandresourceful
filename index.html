<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild &amp; Resourceful — Useful posts for everyday life</title>
<meta name="description" content="Useful posts for everyday life: outdoors, home, tech, trades, shopping, AI, deals and travel. New posts Monday, Wednesday and Friday.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f1b16; --soft:#5d5850; --line:#e4e1db; --green:#1f4a35; --green-2:#2d6649; --tint:#f4f6f3; --white:#fff;
  --serif:'Newsreader',Georgia,serif; --sans:'Source Sans 3',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:var(--green)}
img{max-width:100%;height:auto;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* header */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-top:18px;padding-bottom:14px;flex-wrap:wrap}
.brand{text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{display:block;font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-.4px}
.brand span{font-size:14px;color:var(--soft)}
.search{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.search input{border:0;padding:8px 10px;font:inherit;font-size:15px;width:190px;outline:none}
.search button{border:0;background:var(--tint);padding:0 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.icons{display:flex;gap:6px}
.icons a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;color:var(--ink)}
.icons a:hover{border-color:var(--green);color:var(--green)}
.icons svg{width:18px;height:18px}
.sub-btn{background:var(--green);color:#fff;border:0;padding:10px 18px;font:inherit;font-weight:700;font-size:15px;border-radius:3px;cursor:pointer;text-decoration:none}
.sub-btn:hover{background:var(--green-2)}
nav.cats{border-bottom:3px solid var(--green)}
nav.cats .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
nav.cats a{padding:11px 14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
nav.cats a.on,nav.cats a:hover{background:var(--green);color:#fff}

/* layout */
.page{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;padding-top:28px;padding-bottom:60px}
@media (max-width:900px){.page{grid-template-columns:minmax(0,1fr);gap:36px}}

/* article */
.crumb{font-size:14px;color:var(--soft)}
.crumb a{color:var(--soft)}
.label{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
article h1{font-family:var(--serif);font-weight:700;font-size:42px;line-height:1.12;letter-spacing:-.5px;margin:6px 0 10px}
@media (max-width:600px){article h1{font-size:32px}}
.meta{font-size:14px;color:var(--soft);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
article h2{font-family:var(--serif);font-size:27px;line-height:1.2;margin:34px 0 8px}
article p,article li{max-width:680px}
article figure{margin:0 0 24px}
article figcaption{font-size:14px;color:var(--soft);margin-top:6px}
article table{border-collapse:collapse;width:100%;max-width:680px;font-size:16px;margin:8px 0 18px}
article th,article td{text-align:left;border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
article th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.example{border-left:3px solid var(--green);background:var(--tint);padding:12px 16px;max-width:680px;margin:14px 0}
.example p{margin:0 0 4px}
.next{margin-top:34px;padding:18px 20px;border:1px solid var(--green);max-width:680px}
.next b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.tags{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;border:1px solid var(--line);padding:3px 10px;border-radius:20px;color:var(--soft)}
.note{font-size:14px;color:var(--soft);font-style:italic;max-width:680px;margin-top:22px}

/* feed */
.feed-head h1{font-family:var(--serif);font-size:34px;margin:0 0 4px}
.feed-head p{margin:0 0 18px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chips a{font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:5px 13px;border-radius:20px}
.chips a.on{background:var(--green);border-color:var(--green);color:#fff}
.item{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:20px 0;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
@media (max-width:520px){.item{grid-template-columns:72px minmax(0,1fr);gap:14px}}
.item h2{font-family:var(--serif);font-size:24px;line-height:1.2;margin:2px 0 6px}
.item h2 a{color:var(--ink);text-decoration:none}
.item h2 a:hover{color:var(--green)}
.item p{margin:0 0 6px;color:var(--soft)}
.item small{color:var(--soft)}
.thumb{aspect-ratio:1/1;background:var(--tint);display:flex;align-items:center;justify-content:center;border-radius:3px;color:var(--green);font-family:var(--serif);font-weight:700;font-size:15px;text-align:center;padding:6px;text-decoration:none;line-height:1.15}
.empty{padding:30px 0;color:var(--soft);border-top:1px solid var(--line)}

/* sidebar */
aside section{border-top:3px solid var(--ink);padding-top:12px;margin-bottom:34px}
aside h3{font-family:var(--serif);font-size:21px;margin:0 0 10px}
.subbox{background:var(--tint);border-top-color:var(--green)!important;padding:16px 16px 18px!important}
.subbox ul{margin:6px 0 12px;padding-left:18px;font-size:15px}
.subbox input{width:100%;padding:10px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:3px;margin-bottom:8px}
.subbox .sub-btn{width:100%}
.subbox .ok{font-size:14px;color:var(--green);margin-top:8px;display:none}
.follow a{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:7px 0}
.follow a span{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:50%}
.follow a svg{width:18px;height:18px}
.follow small{display:block;color:var(--soft);font-size:13px;line-height:1.3}
.follow b{font-size:15px}
.mini{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:8px 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.mini .thumb{font-size:11px}
.mini em{display:block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.mini b{font-family:var(--serif);font-size:16px;line-height:1.25;font-weight:700}
ol.trend{list-style:none;padding:0;margin:0;counter-reset:t}
ol.trend li{counter-increment:t;display:grid;grid-template-columns:30px 1fr;padding:8px 0;border-bottom:1px solid var(--line)}
ol.trend li::before{content:counter(t);font-family:var(--serif);font-weight:700;font-size:22px;color:var(--green);line-height:1.1}
ol.trend a{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.3}
ol.trend small{display:block;color:var(--soft);font-size:13px}
.deal p{margin:0 0 10px;font-size:15px}
.deal a.go{font-weight:700}
.browse a{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:15px}
.browse a small{color:var(--soft)}
.rhythm{font-size:14px;color:var(--soft);margin-top:-22px;margin-bottom:34px}

/* footer */
footer{border-top:3px solid var(--green);padding:26px 0 40px;font-size:14px;color:var(--soft)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
</style>
</head>

<header class="top">
  <div class="wrap">

<script>
/* ============ SETTINGS ============

const SUBSCRIBE_URL = "";

const LINKS = [
  {key:"gumroad",  name:"Gumroad",   url:"https://ranumbreanna.gumroad.com", note:"All my products live here. This site just links out."},
  {key:"amazon",   name:"Amazon",    url:"https://link.amazon/B0ajHIUrO", note:"simplybre's Amazon Page: things I actually use."},

  {key:"instagram",name:"Instagram", url:"https://www.instagram.com/glowupinsilence91/", note:"@glowupinsilence91: products and books."}
];
const ICONS = {
  gumroad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  amazon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 11h10.4L20 7H6.2"/></svg>',
  pinterest:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22v-7"/><path d="M8 3h8l-1 6 3 3H6l3-3-1-6z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>'
};

const CATS = ["Outdoors","Tech","Trades","Shopping","AI","Deals","Travel"];

const DEAL = {
  text:"The Subscription Audit Checklist is free on Gumroad right now. Find the subscriptions you're not using before the next renewal hits.",
  url:"https://ranumbreanna.gumroad.com/l/dmttiu", cta:"Get it on Gumroad →"
};

/* ============ POSTS ============
   To add a post: copy one block below, give it a new slug, and fill it in.
   "photo" is optional: put an image URL there and it shows inside the post.
   Newest posts go at the TOP of the list.                                 */
const POSTS = [
{
  slug:"how-to-get-contractor-license-minnesota",
  cat:"Trades", date:"2026-11-25", read:8,
  title:"How to get a contractor license in Minnesota (step by step)",
  dek:"Minnesota has no \"general contractor license.\" Here's which license you actually need, what's on the exam, and the deadlines that cost contractors money.",
  tags:["Contractor license","Minnesota","Exam"],
  photo:"", photoCaption:"",
  next:"Open DLI's residential contractor page and decide which license fits your work: building contractor or remodeler. That one answer decides your exam.",
  body:`
<p>You're good at the work. Homeowners keep asking if you can take the whole job. But the second you look up how to get licensed in Minnesota, you land on a state website full of forms, codes and statute numbers.</p>
<p>I help run a family framing and contracting business here in Minnesota, so I've been through this maze. Here's the plain-words version.</p>
<h2>First: Minnesota doesn't have a "general contractor license"</h2>
<p>This trips up almost everyone. What Minnesota has is a <strong>residential building contractor license</strong>, issued by the Department of Labor and Industry (DLI). There are also two smaller versions:</p>
<table><tr><th>License</th><th>What it lets you do</th></tr>
<tr><td>Residential building contractor (BC)</td><td>Everything, including new homes and detached garages</td></tr>
<tr><td>Residential remodeler (CR)</td><td>Work on existing homes only</td></tr>
<tr><td>Residential roofer (RR)</td><td>Roofing only (not gutters, soffit or fascia)</td></tr></table>
<p>Commercial work is different. It's handled by local cities, not the state.</p>
<h2>Do you even need a license?</h2>
<p>Generally, yes, if you contract <strong>directly with a homeowner</strong> on a home with one to four units, and the job covers <strong>more than one skill area</strong> (say, framing plus drywall plus trim).</p>
<p>If you only work as a sub for a licensed contractor, you usually don't need your own license. There's also an exemption for very small operations. Check DLI's certificate of exemption to see if you qualify.</p>
<p>Why it matters: doing unlicensed work when you need a license is a misdemeanor in Minnesota, and cities can't issue you a building permit without one.</p>
<h2>The 10 steps to getting licensed</h2>
<ol>
<li><strong>Pick your business structure and name.</strong> In Minnesota, the <em>business</em> gets licensed, not you personally.</li>
<li><strong>File with the state and get your tax numbers.</strong></li>
<li><strong>Choose your qualifying person,</strong> the owner or manager who takes the exam for the business.</li>
<li><strong>Pass the exam.</strong> More on this below.</li>
<li><strong>Get insured.</strong> General liability of at least $100,000 per occurrence and $300,000 total for bodily injury, plus $25,000 for property damage (or a $300,000 single-limit policy).</li>
<li><strong>Apply for the license</strong> through DLI.</li>
<li><strong>Write bids and contracts that follow Minnesota law.</strong> Everything in writing, including change orders.</li>
<li><strong>Protect your pay with lien notices.</strong></li>
<li><strong>Hire subs and employees the right way,</strong> including workers' comp.</li>
<li><strong>Renew and keep up your continuing education:</strong> 14 hours every two-year license period.</li>
</ol>
<h2>What's on the Minnesota contractor exam?</h2>
<ul>
<li><strong>110 multiple-choice questions</strong></li>
<li><strong>5.5 hours</strong> to finish, and <strong>70%</strong> to pass</li>
<li>About <strong>60% building code</strong>, and the rest on Minnesota laws and rules</li>
<li>No experience or school required to sit for it</li>
</ul>
<p>They hand you the code book and a reference manual during the test. But 110 questions in 5.5 hours is about 3 minutes each. If you have to hunt for every answer, you'll run out of time. The people who pass know the most-tested numbers cold and know which chapter holds everything else.</p>
<p>If you fail, you wait <strong>30 days</strong> and submit a new application and fee.</p>
<h2>The deadline that costs contractors the most money</h2>
<p>It's the <strong>pre-lien notice.</strong> If you contract directly with a homeowner, the notice has to be in your written contract. With no written contract, you deliver it separately within <strong>10 days</strong> after the work is agreed on. Miss it, and you can lose your lien rights.</p>
<p>If a client won't pay, you generally have <strong>120 days</strong> after your last day of work to record a lien.</p>
<p>I keep a full step-by-step playbook with an exam study guide on my <a href="https://ranumbreanna.gumroad.com" target="_blank" rel="noopener">Gumroad page</a> if you want everything in one place.</p>
<p class="note">General information, not legal advice. Rules change, so confirm with the Minnesota Department of Labor and Industry before you apply. Checked November 2026.</p>`
},
{
  slug:"start-house-cleaning-business-school-hours",
  cat:"Trades", date:"2026-11-24", read:8,
  title:"How to start a house cleaning business during school hours",
  dek:"Price your first job and book clients around school pickup.",
  tags:["Cleaning business","School hours","Pricing"],
  photo:"", photoCaption:"Everything for a first clean fits in one caddy. That's the whole starter kit.",
  next:"Time yourself cleaning one bathroom and one kitchen at home. That pace is the start of every honest quote you'll ever give.",
  body:`
<p>You don't need a free week to start a cleaning business. You need the hours between school drop-off and pickup, one honest price, and a first client who tells a friend.</p>
<p>Start with the schedule you actually have. If drop-off is 8:00 and pickup is 3:00, your work window is about 8:30 to 2:30 once you count driving. That's one bigger clean or two small ones a day, and that's enough to start. Quote from that real window, not from the day you wish you had.</p>
<h2>Price the first job without guessing</h2>
<p>Walk the house once, count the rooms that get cleaned every visit, and time yourself honestly on your own house first. A simple worked example:</p>
<div class="example">
<p><strong>A 3-bedroom, 2-bath home, cleaned every two weeks</strong></p>
<p>Your timed pace says about 2.5 hours, inside the school window.</p>
<p>Quoted flat at $145: a number you can say out loud without flinching.</p>
</div>
<p>The tool I build my bids with lives on my <a href="https://ranumbreanna.gumroad.com" target="_blank" rel="noopener">Gumroad page</a>, linked from the icons at the top of this site.</p>
<h2>Book the second client before the first clean</h2>
<p>Ask the first client one question at booking: "Who on your street hates cleaning?" One name is worth more than any ad. Send that person one short text the same day, while your name is still fresh.</p>`
}
];

/* Trending: list post slugs in the order you want (top = #1). */
const TRENDING = ["how-to-get-contractor-license-minnesota","start-house-cleaning-business-school-hours"];

/* ============ (no need to edit below) ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const sorted = () => [...POSTS].sort((a,b)=>b.date.localeCompare(a.date));
const catSlug = c => c.toLowerCase();
const thumb = (p, cls="thumb") => `<a class="${cls}" href="#/p/${p.slug}" aria-hidden="true" tabindex="-1">${esc(p.cat)}</a>`;

function iconLinks(){
  return LINKS.map(l=>`<a href="${l.url}" target="_blank" rel="noopener" title="${l.name}" aria-label="${l.name}">${ICONS[l.key]}</a>`).join("");
}
document.querySelectorAll("[data-icons]").forEach(el=>el.innerHTML=iconLinks());

function renderNav(active){
  $("#catNav").innerHTML = [`<a href="#/" class="${!active?'on':''}">Home</a>`]
    .concat(CATS.map(c=>`<a href="#/c/${catSlug(c)}" class="${active===c?'on':''}">${c}</a>`)).join("");
}

function sidebar(current){
  const others = sorted().filter(p=>p!==current);
  const related = [...others.filter(p=>current && p.cat===current.cat), ...others.filter(p=>!current || p.cat!==current.cat)].slice(0,5);
  const trend = TRENDING.map(s=>POSTS.find(p=>p.slug===s)).filter(Boolean).slice(0,5);
  const counts = c => POSTS.filter(p=>p.cat===c).length;
  return `
  <section class="subbox" id="subscribe">
    <h3>Like posts like this?</h3>
    <div>Subscribe free. One email when something's actually worth your time:</div>
    <ul><li>New blog posts (Mon, Wed, Fri)</li><li>Deals worth clicking, when I find them</li><li>New products, the day they go live</li></ul>
    <form id="subForm"><input type="email" id="subEmail" required placeholder="Your email address" aria-label="Your email address"><button class="sub-btn" type="submit">Subscribe — it's free</button></form>
    <div class="ok" id="subOk">Thanks! Check your inbox to confirm.</div>
  </section>
  <p class="rhythm">New posts every Monday, Wednesday and Friday.</p>
  <section class="follow"><h3>Follow &amp; shop</h3>
    ${LINKS.map(l=>`<a href="${l.url}" target="_blank" rel="noopener"><span>${ICONS[l.key]}</span><div><b>${l.name}</b><small>${esc(l.note)}</small></div></a>`).join("")}
  </section>
  ${related.length?`<section><h3>You might be interested in</h3>${related.map(p=>`<a class="mini" href="#/p/${p.slug}"><span class="thumb">${esc(p.cat)}</span><div><em>${esc(p.cat)}</em><b>${esc(p.title)}</b></div></a>`).join("")}</section>`:""}
  ${trend.length?`<section><h3>Trending this week</h3><ol class="trend">${trend.map(p=>`<li><div><a href="#/p/${p.slug}">${esc(p.title)}</a><small>${esc(p.cat)} · ${fmtDate(p.date)}</small></div></li>`).join("")}</ol></section>`:""}
  <section class="deal"><h3>Deal of the week</h3><p>${esc(DEAL.text)}</p><a class="go" href="${DEAL.url}" target="_blank" rel="noopener">${esc(DEAL.cta)}</a></section>
  <section class="browse"><h3>Browse by category</h3>
    ${CATS.map(c=>{const n=counts(c);return `<a href="#/c/${catSlug(c)}"><span>${c}</span><small>${n?n+(n===1?' post':' posts'):'Coming soon'}</small></a>`}).join("")}
  </section>`;
}

function bindSubscribe(){
  const f = $("#subForm"); if(!f) return;
  f.addEventListener("submit", e=>{
    e.preventDefault();
    const email = $("#subEmail").value.trim();
    if(SUBSCRIBE_URL){
      const fd = new FormData(); fd.append("email", email); fd.append("fields[email]", email);
      fetch(SUBSCRIBE_URL,{method:"POST",body:fd,mode:"no-cors"}).finally(()=>{ $("#subOk").style.display="block"; f.reset(); });
    } else {
      window.open(LINKS[0].url, "_blank", "noopener");
    }
  });
}

function feed(cat, query){
  let list = sorted();
  if(cat) list = list.filter(p=>p.cat===cat);
  if(query){
    const q = query.toLowerCase();
    list = list.filter(p=>(p.title+" "+p.dek+" "+p.cat+" "+p.tags.join(" ")+" "+p.body.replace(/<[^>]+>/g," ")).toLowerCase().includes(q));
  }
  const heading = query ? `Search: "${esc(query)}"` : cat ? cat : "Latest posts";
  const sub = query ? `${list.length} result${list.length===1?'':'s'}` : cat ? `Everything filed under ${cat}.` : "Useful posts for everyday life: outdoors, home, tech, trades, saving money and more.";
  $("#main").innerHTML = `
  <div class="feed-head"><h1>${heading}</h1><p>${sub}</p></div>
  ${query?"":`<div class="chips"><a href="#/" class="${!cat?'on':''}">All</a>${CATS.map(c=>`<a href="#/c/${catSlug(c)}" class="${cat===c?'on':''}">${c}</a>`).join("")}</div>`}
  ${list.length ? list.map(p=>`
    <div class="item">${thumb(p)}
      <div><span class="label" style="margin-top:0">${esc(p.cat)}</span>
      <h2><a href="#/p/${p.slug}">${esc(p.title)}</a></h2>
      <p>${esc(p.dek)}</p><small>${fmtDate(p.date)} · ${p.read} min read</small></div>
    </div>`).join("") : `<div class="empty">${query?"No posts match that yet. Try another word.":"Posts in this category are coming soon. New posts go up Monday, Wednesday and Friday."}</div>`}`;
  $("#side").innerHTML = sidebar(null);
  renderNav(cat||null);
  document.title = (cat?cat+" — ":"")+"Wild & Resourceful";
}

function post(p){
  $("#main").innerHTML = `
  <article>
    <div class="crumb"><a href="#/">Home</a> » <a href="#/c/${catSlug(p.cat)}">${esc(p.cat)}</a></div>
    <span class="label">${esc(p.cat)}</span>
    <h1>${esc(p.title)}</h1>
    <div class="meta">${fmtDate(p.date)} · ${p.read} minute read · Filed under <a href="#/c/${catSlug(p.cat)}">${esc(p.cat)}</a></div>
    ${p.photo?`<figure><img src="${esc(p.photo)}" alt="${esc(p.photoCaption||p.title)}">${p.photoCaption?`<figcaption>${esc(p.photoCaption)}</figcaption>`:""}</figure>`:""}
    ${p.body}
    <div class="next"><b>Your one next step</b>${esc(p.next)}</div>
    <div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
  </article>`;
  $("#side").innerHTML = sidebar(p);
  renderNav(p.cat);
  document.title = p.title+" — Wild & Resourceful";
}

function route(){
  const h = location.hash.replace(/^#/,"") || "/";
  if(h==="subscribe"){ return; }
  const m = h.match(/^\/(p|c|search)\/?(.*)$/);
  if(m && m[1]==="p"){ const p = POSTS.find(x=>x.slug===m[2]); p ? post(p) : feed(null); }
  else if(m && m[1]==="c"){ feed(CATS.find(c=>catSlug(c)===m[2])||null); }
  else if(m && m[1]==="search"){ feed(null, decodeURIComponent(m[2]||"")); }
  else feed(null);
  bindSubscribe();
  window.scrollTo(0,0);
}

$("#searchForm").addEventListener("submit", e=>{ e.preventDefault(); const q=$("#q").value.trim(); location.hash = q ? "#/search/"+encodeURIComponent(q) : "#/"; });
$("#topSub").addEventListener("click", e=>{ e.preventDefault(); const s=$("#subscribe"); if(s){ s.scrollIntoView({behavior:"smooth"}); $("#subEmail").focus({preventScroll:true}); } });
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
